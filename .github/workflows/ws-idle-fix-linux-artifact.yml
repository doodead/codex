name: Build patched Codex Linux x64 artifact

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ws-idle-fix-linux-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Apply WebSocket liveness patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-ws-idle-fix.py
          git diff --check
          git diff -- codex-rs/codex-api/src/endpoint/responses_websocket.rs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Build patched Codex
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          export STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          cargo build --target x86_64-unknown-linux-gnu --release --bin codex

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          src="codex-rs/target/x86_64-unknown-linux-gnu/release/codex"
          test -f "$src"
          mkdir -p dist
          cp "$src" dist/codex
          chmod +x dist/codex
          sha256sum dist/codex > dist/codex.sha256
          file dist/codex
          ./dist/codex --version

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-linux-x64-ws-idle-fix
          path: |
            dist/codex
            dist/codex.sha256
          if-no-files-found: error
