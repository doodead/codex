name: WebSocket idle-timeout fix release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ws-idle-fix-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Apply WebSocket liveness patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("codex-rs/codex-api/src/endpoint/responses_websocket.rs")
          text = path.read_text(encoding="utf-8")

          marker = "const WS_HEARTBEAT_INTERVAL: Duration = Duration::from_secs(20);"
          if marker in text:
              print("WebSocket liveness patch is already applied.")
              raise SystemExit(0)

          old = '''        let pump_task = tokio::spawn(async move {
              let mut inner = inner;
              loop {
                  tokio::select! {
                      command = rx_command.recv() => {
          '''
          new = '''        let pump_task = tokio::spawn(async move {
              let mut inner = inner;
              let mut heartbeat = tokio::time::interval_at(
                  Instant::now() + WS_HEARTBEAT_INTERVAL,
                  WS_HEARTBEAT_INTERVAL,
              );
              heartbeat.set_missed_tick_behavior(tokio::time::MissedTickBehavior::Delay);
              loop {
                  tokio::select! {
                      _ = heartbeat.tick() => {
                          if let Err(err) = inner.send(Message::Ping(Default::default())).await {
                              let _ = tx_message.send(Err(err));
                              break;
                          }
                      }
                      command = rx_command.recv() => {
          '''
          if old not in text:
              raise SystemExit("Could not locate WsStream pump insertion point; upstream changed.")
          text = text.replace(old, new, 1)

          old = '''                            Ok(Message::Ping(payload)) => {
                                  if let Err(err) = inner.send(Message::Pong(payload)).await {
                                      let _ = tx_message.send(Err(err));
                                      break;
                                  }
                              }
                              Ok(Message::Pong(_)) => {}
          '''
          new = '''                            Ok(Message::Ping(payload)) => {
                                  let activity = Message::Ping(payload.clone());
                                  if let Err(err) = inner.send(Message::Pong(payload)).await {
                                      let _ = tx_message.send(Err(err));
                                      break;
                                  }
                                  if tx_message.send(Ok(activity)).is_err() {
                                      break;
                                  }
                              }
                              Ok(message @ Message::Pong(_)) => {
                                  if tx_message.send(Ok(message)).is_err() {
                                      break;
                                  }
                              }
          '''
          if old not in text:
              raise SystemExit("Could not locate Ping/Pong handling; upstream changed.")
          text = text.replace(old, new, 1)

          old = '''const X_CODEX_TURN_STATE_HEADER: &str = "x-codex-turn-state";
          '''
          new = '''const WS_HEARTBEAT_INTERVAL: Duration = Duration::from_secs(20);
          const X_CODEX_TURN_STATE_HEADER: &str = "x-codex-turn-state";
          '''
          if old not in text:
              raise SystemExit("Could not locate WebSocket constants; upstream changed.")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -

          git diff --check
          git diff -- codex-rs/codex-api/src/endpoint/responses_websocket.rs

      - name: Commit patch to fork
        id: commit
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- codex-rs/codex-api/src/endpoint/responses_websocket.rs)) {
            "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/codex-api/src/endpoint/responses_websocket.rs
          git commit -m "Fix false Responses WebSocket idle timeout" -m "Send periodic WebSocket pings and forward Ping/Pong transport activity to the response waiter so long reasoning silence does not look like a dead stream.\n\nBased on openai/codex#39771."
          git push origin HEAD:main
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Configure MSVC environment
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Build patched Codex
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          cargo build --target x86_64-pc-windows-msvc --release --bin codex

      - name: Stage release binary
        id: stage
        shell: pwsh
        run: |
          $source = "codex-rs/target/x86_64-pc-windows-msvc/release/codex.exe"
          if (-not (Test-Path $source)) {
            throw "Built codex.exe not found at $source"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $source dist/codex.exe
          $hash = (Get-FileHash dist/codex.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline dist/codex.exe.sha256 "$hash  codex.exe"
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-windows-x64-ws-idle-fix
          path: |
            dist/codex.exe
            dist/codex.exe.sha256
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA: ${{ steps.commit.outputs.sha }}
          EXE_SHA256: ${{ steps.stage.outputs.sha256 }}
        run: |
          $short = $env:PATCH_SHA.Substring(0, 12)
          $tag = "ws-idle-fix-$short"
          $title = "Codex Windows x64 - WebSocket idle-timeout fix ($short)"
          $notes = @"
          Unofficial Windows x64 build of Codex from this fork with the false Responses WebSocket idle-timeout workaround based on openai/codex#39771.

          Patch behavior:
          - sends a WebSocket Ping every 20 seconds;
          - forwards received Ping/Pong frames to the response waiter as transport activity;
          - the response loop already ignores Ping/Pong, so transport liveness resets the existing idle watchdog without fabricating Responses API events.

          Commit: $env:PATCH_SHA
          codex.exe SHA-256: $env:EXE_SHA256
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/codex.exe dist/codex.exe.sha256 --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag dist/codex.exe dist/codex.exe.sha256 --repo $env:GITHUB_REPOSITORY --target $env:PATCH_SHA --title $title --notes $notes
          }
